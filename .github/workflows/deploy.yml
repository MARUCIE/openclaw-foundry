# OpenClaw Foundry — Full Pipeline DAG
#
# Daily sync (cron 06:00 UTC / workflow_dispatch):
#   scrape-clawhub-api.mjs → data/clawhub-skills-raw.json
#   scrape-mcp-registry.mjs → data/mcp-registry-servers.json
#   merge-all-sources.mjs → data/unified-index.json
#   prebuild-static.mjs → web/public/data/skills.json (raw)
#   curate-skills.mjs → web/public/data/skills.json (dedup + rating + icons)
#   tag-skills-llm.mjs → web/public/data/skills.json (+ tags + taglines + reclassify) [incremental, optional]
#   generate-seed-sql.mjs → worker/src/seed.sql (from curated data)
#   git commit → persist curated data to repo
#
# Push to main:
#   generate-packs.mjs (via npm prebuild) → web/public/packs/ (source files)
#   wrangler deploy → CF Worker
#   apply D1 migrations
#   next build → web/out/ (static export)
#   upload protected pack payloads to R2, then prune them from web/out/
#   wrangler pages deploy → CF Pages

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  # ── Step 1: Scrape + process data (cron/dispatch only) ──
  sync-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scrape ClawHub API
        run: node scripts/scrape-clawhub-api.mjs --process

      - name: Scrape MCP Registry
        run: node scripts/scrape-mcp-registry.mjs

      - name: Merge all sources
        run: node scripts/merge-all-sources.mjs

      - name: Prebuild static data
        run: node scripts/prebuild-static.mjs --no-api

      - name: Verify prebuild has data
        run: |
          SKILL_COUNT=$(node -e "const d=require('./web/public/data/skills.json');console.log(d.skills?.length||0)")
          echo "Prebuild skills: $SKILL_COUNT"
          if [ "$SKILL_COUNT" -lt 100 ]; then
            echo "ERROR: Prebuild has less than 100 skills — aborting"
            exit 1
          fi

      # ── Curation pipeline (dedup + rating + icons + LLM tags) ──
      - name: Curate skills (dedup + rating calibration + icons)
        run: node scripts/curate-skills.mjs

      - name: LLM enrichment (tags + taglines + reclassify — incremental)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/tag-skills-llm.mjs

      - name: Generate seed SQL (from curated data)
        run: node scripts/generate-seed-sql.mjs

      # ── Commit curated data back to repo ──
      - name: Commit curated data
        run: |
          git config user.email "openclaw-bot@openclaw-foundry.pages.dev"
          git config user.name "OpenClaw Sync Bot"
          git add web/public/data/ worker/src/seed.sql
          git diff --cached --quiet || git commit -m "chore(sync): refresh curated skills $(date -I)"
          git push origin main || echo "NOTE: Push failed (likely concurrent push), skipping"

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sync-data
          retention-days: 3
          path: |
            web/public/data/skills.json
            web/public/data/skills-categories.json
            web/public/data/providers.json
            web/public/data/stats.json
            worker/src/seed.sql

  # ── Step 4: Deploy frontend after Worker routes + D1 migrations exist ──
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [sync-data, apply-migrations]
    if: always() && (needs.sync-data.result == 'success' || needs.sync-data.result == 'skipped') && needs.apply-migrations.result == 'success'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd web && npm ci

      # Download fresh data from sync-data job (if available)
      - name: Download synced data
        if: needs.sync-data.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sync-data
          merge-multiple: true

      # On push events (no sync-data), use git-committed static files
      - name: Verify static data exists
        run: |
          if [ ! -f web/public/data/skills.json ]; then
            echo "ERROR: No static skills data found"
            exit 1
          fi
          SKILL_COUNT=$(node -e "const d=require('./web/public/data/skills.json');console.log(d.skills?.length||0)")
          echo "Static skills: $SKILL_COUNT"
          if [ "$SKILL_COUNT" -lt 100 ]; then
            echo "ERROR: Static data has less than 100 skills"
            exit 1
          fi

      - name: Generate packs + Build Next.js static export
        run: cd web && npm run build

      - name: Ensure CF Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          OUT=$(npx --yes wrangler@4.76.0 pages project create agent-foundry --production-branch main 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ "$STATUS" -ne 0 ] && ! echo "$OUT" | grep -Eiq 'already exists|project.*exists'; then
            exit "$STATUS"
          fi

      - name: Upload protected pack files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker && npm ci
          cd ..
          node scripts/upload-protected-packs-to-r2.mjs

      - name: Remove protected pack files from Pages export
        run: node scripts/prune-public-pack-downloads.mjs

      - name: Deploy to CF Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name agent-foundry --branch main --commit-dirty=true

      - name: Build legacy Pages redirect
        run: |
          mkdir -p /tmp/openclaw-foundry-redirect
          printf '%s\n' '/explore/platforms https://agent-foundry.pages.dev/packs 301' > /tmp/openclaw-foundry-redirect/_redirects
          printf '%s\n' '/* https://agent-foundry.pages.dev/:splat 301' >> /tmp/openclaw-foundry-redirect/_redirects
          printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=https://agent-foundry.pages.dev/"><link rel="canonical" href="https://agent-foundry.pages.dev/">' > /tmp/openclaw-foundry-redirect/index.html

      - name: Redirect legacy CF Pages host
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/openclaw-foundry-redirect --project-name openclaw-foundry --branch main --commit-dirty=true

  # ── Step 2: Deploy worker ──
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        run: cd worker && npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  # ── Step 3: Apply D1 schema migrations (always on push, idempotent) ──
  # Every migration-v*.sql uses CREATE ... IF NOT EXISTS, so replay is safe.
  # Runs after deploy-worker so the worker code expecting the new tables exists.
  apply-migrations:
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        run: cd worker && npm ci

      - name: Apply D1 migrations v7+ (CI-managed migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          # Scope: v2-v6 were applied manually pre-CI; their replay is unsafe
          # because later migrations rename/drop columns referenced by earlier ones
          # (e.g. v4 references "role" which v5+ dropped). v7+ are CI-managed:
          # each MUST be idempotent (CREATE ... IF NOT EXISTS only).
          # Followup debt: switch to a _migrations tracking table so this gate
          # becomes "run only if version not yet recorded."
          IDEMPOTENT_RE='duplicate column name|already exists|UNIQUE constraint failed|table .* already|index .* already'
          shopt -s nullglob
          for mig in src/migration-v[7-9].sql src/migration-v[1-9][0-9].sql; do
            echo "::group::Applying $mig"
            set +e
            OUT=$(npx wrangler d1 execute openclaw-foundry --remote --file="$mig" 2>&1)
            RC=$?
            set -e
            echo "$OUT"
            if [ "$RC" -ne 0 ]; then
              if echo "$OUT" | grep -qiE "$IDEMPOTENT_RE"; then
                echo "::notice title=$mig::idempotent re-apply OK (already-applied state)"
              else
                echo "::error title=$mig::real failure (not an idempotent re-apply)"
                exit 1
              fi
            fi
            echo "::endgroup::"
          done

  # ── Step 4: Seed D1 (only after fresh sync) ──
  seed-db:
    runs-on: ubuntu-latest
    needs: [sync-data, deploy-worker]
    if: needs.sync-data.result == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download seed SQL
        uses: actions/download-artifact@v4
        with:
          name: sync-data
          merge-multiple: true

      - name: Verify seed SQL exists
        run: |
          if [ ! -f worker/src/seed.sql ]; then
            echo "ERROR: seed.sql not found in artifacts"
            exit 1
          fi
          LINES=$(wc -l < worker/src/seed.sql)
          echo "Seed SQL: $LINES lines"
          if [ "$LINES" -lt 100 ]; then
            echo "ERROR: seed.sql has less than 100 lines"
            exit 1
          fi

      - name: Install worker dependencies
        run: cd worker && npm ci

      - name: Seed D1 database (batched)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker

          # Find where skill INSERTs start (after header with providers)
          HEADER_END=$(grep -n "^INSERT INTO skills" src/seed.sql | head -1 | cut -d: -f1)
          HEADER_END=$((HEADER_END - 1))
          echo "Header: $HEADER_END lines"

          # Execute header (providers)
          head -$HEADER_END src/seed.sql > /tmp/seed-header.sql
          npx wrangler d1 execute openclaw-foundry --remote --command "DELETE FROM skills; DELETE FROM providers;"
          npx wrangler d1 execute openclaw-foundry --remote --file=/tmp/seed-header.sql

          # Split skill INSERTs into batches
          tail -n +$((HEADER_END + 1)) src/seed.sql | grep "^INSERT" | split -d -l 10000 - /tmp/seed-batch-

          BATCH=0
          for f in /tmp/seed-batch-*; do
            BATCH=$((BATCH + 1))
            LINES=$(wc -l < "$f")
            echo "Batch $BATCH: $f ($LINES lines)"
            npx wrangler d1 execute openclaw-foundry --remote --file="$f" || echo "WARN: Batch $BATCH had errors"
          done

          # Verify minimum count
          RESULT=$(npx wrangler d1 execute openclaw-foundry --remote --command "SELECT COUNT(*) as total FROM skills" --json 2>&1)
          echo "$RESULT"
          TOTAL=$(echo "$RESULT" | grep -o '"total":[0-9]*' | grep -o '[0-9]*')
          echo "D1 total skills: $TOTAL"
          if [ "$TOTAL" -lt 1000 ]; then
            echo "ERROR: D1 has less than 1000 skills after seed — possible failure"
            exit 1
          fi
          echo "OK: D1 seed complete ($TOTAL skills)"
